<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocket Snake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
[hidden] { display: none !important; }
body { margin: 0; }
/* Layout: one handheld console centred on a dark desk — LCD screen on top, d-pad and buttons below. Deliberately single-theme. */
:root {
  --desk: #17181b;
  --shell: #2a2c31;
  --shell-hi: #3a3d44;
  --shell-lo: #1e1f23;
  --lcd: #a7b98a;
  --lcd-ghost: #9cae80;
  --ink: #233018;
  --ink-soft: #4d5e3a;
  --label: #c9cbd1;
  --label-dim: #868a94;
  --accent: #d6553f;
  --f-display: "Silkscreen", "Courier New", monospace;
  --f-body: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--desk);
  color: var(--label);
  font-family: var(--f-body);
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding-block: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
.device {
  width: 100%;
  max-width: 440px;
  background: linear-gradient(180deg, var(--shell-hi), var(--shell) 18%, var(--shell) 85%, var(--shell-lo));
  border-radius: 22px 22px 56px 22px;
  padding: 20px 20px 28px;
  box-shadow: 0 1px 0 rgba(255,255,255,.08) inset, 0 24px 60px rgba(0,0,0,.55);
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.brand {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
}
.brand h1 {
  margin: 0;
  font-family: var(--f-display);
  font-weight: 700;
  font-size: 1.35rem;
  letter-spacing: .04em;
  color: var(--label);
}
.brand h1 span { color: var(--accent); }
.brand small {
  font-size: .68rem;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--label-dim);
}
.bezel {
  background: var(--shell-lo);
  border-radius: 10px;
  padding: 14px;
  box-shadow: 0 2px 6px rgba(0,0,0,.5) inset;
}
.lcd {
  background: var(--lcd);
  border-radius: 4px;
  padding: 10px;
  color: var(--ink);
  box-shadow: 0 0 0 1px rgba(0,0,0,.35) inset, 0 6px 14px rgba(0,0,0,.18) inset;
  position: relative;
}
.hud {
  display: flex;
  justify-content: space-between;
  font-family: var(--f-display);
  font-size: .78rem;
  letter-spacing: .06em;
  padding: 0 2px 8px;
  font-variant-numeric: tabular-nums;
  gap: 8px;
}
.hud b { font-weight: 700; }
.stage { position: relative; }
canvas {
  display: block;
  width: 100%;
  aspect-ratio: 1 / 1;
  max-width: 100%;
  touch-action: none;
  border-top: 2px solid var(--ink);
  border-bottom: 2px solid var(--ink);
}
.msg {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  text-align: center;
  background: rgba(167,185,138,.86);
  font-family: var(--f-display);
  padding: 16px;
}
.msg h2 { margin: 0; font-size: 1.6rem; letter-spacing: .05em; text-wrap: balance; }
.msg p { margin: 0; font-family: var(--f-body); font-size: .8rem; color: var(--ink-soft); max-width: 28ch; line-height: 1.5; }
.msg .blink { font-size: .8rem; color: var(--ink); animation: blink 1.1s steps(2, start) infinite; }
@keyframes blink { to { visibility: hidden; } }

.controls {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 18px;
  align-items: center;
}
.dpad {
  display: grid;
  grid-template-columns: repeat(3, 48px);
  grid-template-rows: repeat(3, 48px);
}
.dpad button {
  background: var(--shell-lo);
  border: 0;
  color: var(--label-dim);
  font-size: 1rem;
  cursor: pointer;
  box-shadow: 0 3px 0 #0f1012, 0 1px 0 rgba(255,255,255,.06) inset;
}
.dpad button:active { transform: translateY(2px); box-shadow: 0 1px 0 #0f1012; }
.dpad .up { grid-area: 1 / 2; border-radius: 6px 6px 0 0; }
.dpad .left { grid-area: 2 / 1; border-radius: 6px 0 0 6px; }
.dpad .hub { grid-area: 2 / 2; background: var(--shell-lo); }
.dpad .right { grid-area: 2 / 3; border-radius: 0 6px 6px 0; }
.dpad .down { grid-area: 3 / 2; border-radius: 0 0 6px 6px; }
.actions { display: flex; flex-direction: column; gap: 14px; align-items: flex-end; }
.round {
  display: flex; align-items: center; gap: 10px;
  background: none; border: 0; padding: 0; cursor: pointer;
  color: var(--label); font-family: var(--f-display); font-size: .78rem; letter-spacing: .08em;
}
.round i {
  width: 52px; height: 52px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #e7735e, var(--accent) 55%, #9b3626);
  box-shadow: 0 4px 0 #6a2418, 0 6px 12px rgba(0,0,0,.4);
  display: block;
}
.round:active i { transform: translateY(3px); box-shadow: 0 1px 0 #6a2418; }
.pills { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
.pill {
  background: var(--shell-lo);
  color: var(--label-dim);
  border: 0;
  border-radius: 999px;
  padding: 7px 12px;
  font-family: var(--f-body);
  font-size: .7rem;
  letter-spacing: .1em;
  text-transform: uppercase;
  cursor: pointer;
  box-shadow: 0 2px 0 #0f1012;
}
.pill[aria-pressed="true"] { color: var(--label); }
.pill[aria-pressed="true"]::before { content: "● "; color: var(--accent); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.keys {
  margin: 0;
  font-size: .7rem;
  color: var(--label-dim);
  line-height: 1.7;
  letter-spacing: .02em;
}
.keys kbd {
  font-family: var(--f-body);
  background: var(--shell-lo);
  border-radius: 3px;
  padding: 1px 5px;
  color: var(--label);
}
.grille { display: flex; gap: 6px; justify-content: flex-end; margin-top: -6px; }
.grille span { width: 34px; height: 4px; border-radius: 2px; background: var(--shell-lo); transform: rotate(-24deg); }
@media (max-width: 380px) {
  .dpad { grid-template-columns: repeat(3, 42px); grid-template-rows: repeat(3, 42px); }
  .device { padding: 16px 14px 24px; }
}
@media (prefers-reduced-motion: reduce) { .msg .blink { animation: none; } }
</style>
</head>
<body>

<div class="device">
  <div class="brand">
    <h1>Pocket<span>·</span>Snake</h1>
    <small>Model S-20</small>
  </div>

  <div class="bezel">
    <div class="lcd">
      <div class="hud">
        <span>SCORE <b id="score">0000</b></span>
        <span>LV <b id="level">1</b></span>
        <span>HI <b id="best">0000</b></span>
      </div>
      <div class="stage">
        <canvas id="board" aria-label="Snake game board" role="img"></canvas>
        <div class="msg" id="msg">
          <h2 id="msgTitle">SNAKE</h2>
          <p id="msgBody">Eat the food, grow longer, and don't bite yourself. Every 5 bites raises the speed.</p>
          <div class="blink" id="msgCta">PRESS START</div>
        </div>
      </div>
    </div>
  </div>

  <div class="controls">
    <div class="dpad" aria-label="Direction pad">
      <button class="up" id="btnUp" aria-label="Up">▲</button>
      <button class="left" id="btnLeft" aria-label="Left">◀</button>
      <span class="hub"></span>
      <button class="right" id="btnRight" aria-label="Right">▶</button>
      <button class="down" id="btnDown" aria-label="Down">▼</button>
    </div>
    <div class="actions">
      <button class="round" id="btnStart"><span id="startLabel">START</span><i></i></button>
      <div class="pills">
        <button class="pill" id="btnWrap" aria-pressed="false">Wrap walls</button>
        <button class="pill" id="btnSound" aria-pressed="true">Sound</button>
      </div>
    </div>
  </div>
  <div class="grille" aria-hidden="true"><span></span><span></span><span></span><span></span></div>

  <p class="keys">
    <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> to steer ·
    <kbd>Space</kbd> start / pause · <kbd>R</kbd> restart. On a phone, swipe on the screen or use the pad.
  </p>
</div>

<script>
(() => {
  const N = 20;                       // grid cells per side
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const $ = id => document.getElementById(id);
  const ui = {
    score: $('score'), level: $('level'), best: $('best'),
    msg: $('msg'), title: $('msgTitle'), body: $('msgBody'), cta: $('msgCta'),
    startLabel: $('startLabel'), wrap: $('btnWrap'), sound: $('btnSound')
  };
  const COLORS = { ghost: '#9cae80', ink: '#233018', soft: '#4d5e3a', lcd: '#a7b98a' };

  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };

  let snake, dir, queue, food, bonus, score, level, eaten, state, acc, last, grow, flash;
  let best = store.get('pocket-snake-best', 0);
  let wrap = store.get('pocket-snake-wrap', false);
  let soundOn = store.get('pocket-snake-sound', true);
  ui.wrap.setAttribute('aria-pressed', wrap);
  ui.sound.setAttribute('aria-pressed', soundOn);

  // ---------- sound ----------
  let audio = null;
  function beep(freq, dur = 0.06, type = 'square', vol = 0.05) {
    if (!soundOn) return;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, audio.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + dur);
      o.connect(g).connect(audio.destination);
      o.start(); o.stop(audio.currentTime + dur);
    } catch {}
  }

  // ---------- sizing ----------
  function resize() {
    const css = canvas.clientWidth;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = canvas.height = Math.round(css * dpr);
    draw();
  }

  // ---------- game state ----------
  function reset() {
    snake = [{ x: 9, y: 10 }, { x: 8, y: 10 }, { x: 7, y: 10 }, { x: 6, y: 10 }];
    dir = { x: 1, y: 0 };
    queue = [];
    score = 0; level = 1; eaten = 0; grow = 0; flash = 0;
    bonus = null;
    food = spawn();
    acc = 0;
    updateHud();
  }

  function occupied(x, y) {
    return snake.some(s => s.x === x && s.y === y) ||
      (food && food.x === x && food.y === y) ||
      (bonus && bonus.x === x && bonus.y === y);
  }
  function spawn() {
    const free = [];
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (!occupied(x, y)) free.push({ x, y });
    return free.length ? free[(Math.random() * free.length) | 0] : null;
  }

  const speed = () => Math.max(55, 150 - (level - 1) * 11); // ms per step

  function step() {
    if (queue.length) dir = queue.shift();
    const h = snake[0];
    let nx = h.x + dir.x, ny = h.y + dir.y;
    if (wrap) { nx = (nx + N) % N; ny = (ny + N) % N; }
    else if (nx < 0 || ny < 0 || nx >= N || ny >= N) return die('You hit the wall.');

    // tail moves away this step unless growing, so it's a legal square
    const body = grow > 0 ? snake : snake.slice(0, -1);
    if (body.some(s => s.x === nx && s.y === ny)) return die('You bit your own tail.');

    snake.unshift({ x: nx, y: ny });
    if (grow > 0) grow--; else snake.pop();

    if (food && nx === food.x && ny === food.y) {
      score += 10 * level; eaten++; grow += 1;
      beep(660, 0.05);
      if (eaten % 5 === 0) { level++; beep(990, 0.12, 'square', 0.04); }
      food = spawn();
      if (eaten % 4 === 0 && !bonus) { bonus = spawn(); if (bonus) bonus.life = 45; }
      if (!food) return win();
    }
    if (bonus) {
      if (nx === bonus.x && ny === bonus.y) {
        score += 50 * level; grow += 2; flash = 6;
        beep(880, 0.05); setTimeout(() => beep(1320, 0.08), 60);
        bonus = null;
      } else if (--bonus.life <= 0) bonus = null;
    }
    if (flash > 0) flash--;
    updateHud();
  }

  function die(reason) {
    state = 'over';
    beep(180, 0.3, 'sawtooth', 0.06);
    const newBest = score > best;
    if (newBest) { best = score; store.set('pocket-snake-best', best); }
    updateHud();
    show('GAME OVER', `${reason} Score ${score}, length ${snake.length}.${newBest ? ' New high score!' : ''}`, 'PRESS START');
    ui.startLabel.textContent = 'AGAIN';
  }
  function win() {
    state = 'over';
    if (score > best) { best = score; store.set('pocket-snake-best', best); }
    updateHud();
    show('YOU WIN', 'The snake filled the whole screen. That almost never happens.', 'PRESS START');
    ui.startLabel.textContent = 'AGAIN';
  }

  // ---------- UI ----------
  const pad = n => String(n).padStart(4, '0');
  function updateHud() {
    ui.score.textContent = pad(score);
    ui.best.textContent = pad(best);
    ui.level.textContent = level;
  }
  function show(t, b, c) { ui.title.textContent = t; ui.body.textContent = b; ui.cta.textContent = c; ui.msg.hidden = false; }
  function hide() { ui.msg.hidden = true; }

  function start() {
    if (state === 'running') return pause();
    if (state === 'paused') { state = 'running'; hide(); ui.startLabel.textContent = 'PAUSE'; last = performance.now(); return; }
    reset();
    state = 'running';
    hide();
    ui.startLabel.textContent = 'PAUSE';
    last = performance.now();
    beep(520, 0.05);
  }
  function pause() {
    if (state !== 'running') return;
    state = 'paused';
    show('PAUSED', `Score ${score} · length ${snake.length}`, 'PRESS START');
    ui.startLabel.textContent = 'RESUME';
  }

  function turn(x, y) {
    if (state === 'ready' || state === 'over') { start(); }
    if (state !== 'running') return;
    const ref = queue.length ? queue[queue.length - 1] : dir;
    if ((x === -ref.x && y === -ref.y) || (x === ref.x && y === ref.y)) return;
    if (queue.length < 3) queue.push({ x, y });
  }

  // ---------- drawing ----------
  function cellRect(x, y, c, inset) {
    ctx.fillRect(x * c + inset, y * c + inset, c - inset * 2, c - inset * 2);
  }
  function draw() {
    if (!snake) return;
    const W = canvas.width, c = W / N, g = Math.max(1, c * 0.08);
    ctx.fillStyle = COLORS.lcd;
    ctx.fillRect(0, 0, W, W);

    // ghost pixels like an unlit LCD
    ctx.fillStyle = COLORS.ghost;
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) cellRect(x, y, c, g);

    // walls hint in wrap mode: dashed edge
    if (wrap) {
      ctx.strokeStyle = COLORS.soft; ctx.lineWidth = Math.max(1, c * 0.06);
      ctx.setLineDash([c * 0.4, c * 0.4]);
      ctx.strokeRect(ctx.lineWidth / 2, ctx.lineWidth / 2, W - ctx.lineWidth, W - ctx.lineWidth);
      ctx.setLineDash([]);
    }

    // food: a diamond
    if (food) {
      const cx = food.x * c + c / 2, cy = food.y * c + c / 2, r = c * 0.38;
      ctx.fillStyle = COLORS.ink;
      ctx.beginPath();
      ctx.moveTo(cx, cy - r); ctx.lineTo(cx + r, cy); ctx.lineTo(cx, cy + r); ctx.lineTo(cx - r, cy);
      ctx.closePath(); ctx.fill();
    }

    // bonus: a ring that blinks faster as it runs out
    if (bonus) {
      const rate = bonus.life < 15 ? 2 : 4;
      if (Math.floor(bonus.life / rate) % 2 === 0 || state !== 'running') {
        ctx.fillStyle = COLORS.ink;
        cellRect(bonus.x, bonus.y, c, g);
        ctx.fillStyle = COLORS.lcd;
        cellRect(bonus.x, bonus.y, c, c * 0.3);
      }
      // timer bar along the bottom edge
      ctx.fillStyle = COLORS.soft;
      ctx.fillRect(0, W - c * 0.12, W * (bonus.life / 45), c * 0.12);
    }

    // snake
    ctx.fillStyle = flash % 2 ? COLORS.soft : COLORS.ink;
    snake.forEach((s, i) => {
      cellRect(s.x, s.y, c, i === 0 ? g * 0.5 : g);
      // bridge the gap to the next segment so the body reads continuous
      const n = snake[i + 1];
      if (n && Math.abs(n.x - s.x) + Math.abs(n.y - s.y) === 1) {
        const x = Math.min(s.x, n.x), y = Math.min(s.y, n.y);
        if (n.x !== s.x) ctx.fillRect(x * c + c - g, y * c + g * 2, g * 2, c - g * 4);
        else ctx.fillRect(x * c + g * 2, y * c + c - g, c - g * 4, g * 2);
      }
    });
    // eyes
    const h = snake[0], e = c * 0.14;
    ctx.fillStyle = COLORS.lcd;
    const fx = dir.x, fy = dir.y;
    const ex = h.x * c + c / 2 + fx * c * 0.18, ey = h.y * c + c / 2 + fy * c * 0.18;
    const px = -fy * c * 0.2, py = fx * c * 0.2;
    ctx.fillRect(ex + px - e / 2, ey + py - e / 2, e, e);
    ctx.fillRect(ex - px - e / 2, ey - py - e / 2, e, e);
  }

  // ---------- loop ----------
  function frame(now) {
    if (state === 'running') {
      acc += now - last;
      const s = speed();
      let guard = 0;
      while (acc >= s && state === 'running' && guard++ < 5) { acc -= s; step(); }
      if (guard >= 5) acc = 0;
    }
    last = now;
    draw();
    requestAnimationFrame(frame);
  }

  // ---------- input ----------
  const KEYS = {
    ArrowUp: [0, -1], KeyW: [0, -1], ArrowDown: [0, 1], KeyS: [0, 1],
    ArrowLeft: [-1, 0], KeyA: [-1, 0], ArrowRight: [1, 0], KeyD: [1, 0]
  };
  window.addEventListener('keydown', e => {
    if (KEYS[e.code]) { e.preventDefault(); turn(...KEYS[e.code]); }
    else if (e.code === 'Space' || e.code === 'Enter' || e.code === 'KeyP') {
      if (e.target.tagName === 'BUTTON' && e.code !== 'KeyP') return; // let buttons handle their own activation
      e.preventDefault(); start();
    }
    else if (e.code === 'KeyR') { state = 'ready'; start(); }
  });

  const bind = (id, x, y) => $(id).addEventListener('pointerdown', e => { e.preventDefault(); turn(x, y); });
  bind('btnUp', 0, -1); bind('btnDown', 0, 1); bind('btnLeft', -1, 0); bind('btnRight', 1, 0);
  $('btnStart').addEventListener('click', start);
  ui.wrap.addEventListener('click', () => {
    wrap = !wrap; ui.wrap.setAttribute('aria-pressed', wrap); store.set('pocket-snake-wrap', wrap);
  });
  ui.sound.addEventListener('click', () => {
    soundOn = !soundOn; ui.sound.setAttribute('aria-pressed', soundOn); store.set('pocket-snake-sound', soundOn);
  });

  // swipe on the screen
  let t0 = null;
  canvas.addEventListener('pointerdown', e => { t0 = { x: e.clientX, y: e.clientY }; });
  ui.msg.addEventListener('click', start);
  canvas.addEventListener('pointerup', e => {
    if (!t0) return;
    const dx = e.clientX - t0.x, dy = e.clientY - t0.y;
    t0 = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) { if (state !== 'running') start(); return; }
    if (Math.abs(dx) > Math.abs(dy)) turn(Math.sign(dx), 0); else turn(0, Math.sign(dy));
  });

  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  window.addEventListener('resize', resize);

  // boot
  reset();
  state = 'ready';
  ui.msg.hidden = false;
  resize();
  last = performance.now();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
